site_name: Python-tutoring

theme:
  name: material
  features:
    - content.code.copy

nav:
  # - "Занятие 1. Что такое программирование?":
  #   - lesson1/main.md
  - lesson1/main.md
  - lesson2/main.md
  - lesson3/lesson3.md
  - lesson4/lesson4.md
  - lesson5/lesson5.md
  - lesson6/lesson6.md
  - lesson7/lesson7.md
  - lesson8/lesson8.md
  - lesson9/lesson9.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - search
  - autolinks 